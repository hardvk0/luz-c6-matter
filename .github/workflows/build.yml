name: Compilar y publicar firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La imagen de esp-matter ocupa muchos GB: sin esto el runner se queda sin disco al descargarla.
      - name: Liberar espacio en disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Docker Hub a veces no responde desde los runners: se reintenta con espera creciente.
      - name: Descargar la imagen de esp-matter (con reintentos)
        run: |
          for i in 1 2 3 4 5; do
            if docker pull espressif/esp-matter:release-v1.6; then exit 0; fi
            echo "Intento $i fallido; reintentando en $((i*20)) s"
            sleep $((i*20))
          done
          exit 1

      - name: Compilar dentro de la imagen oficial de esp-matter (ESP-IDF 5.5)
        run: |
          docker run --rm --entrypoint bash \
            -v "$GITHUB_WORKSPACE":/project -w /project \
            -e RUN_NUMBER="${{ github.run_number }}" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            espressif/esp-matter:release-v1.6 ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
