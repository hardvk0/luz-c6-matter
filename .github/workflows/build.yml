name: Compilar y publicar firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl unzip flex bison gperf pkg-config \
            python3-pip python3-venv python3-dev cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0 libglib2.0-dev \
            libgirepository1.0-dev libcairo2-dev

      # Se instala desde GitHub (sin Docker Hub, que limita las descargas desde los runners).
      - name: Instalar ESP-IDF 5.5.5 y esp-matter release/v1.6
        run: bash ci/setup.sh

      - name: Compilar firmware (ESP32-C6)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: bash ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
